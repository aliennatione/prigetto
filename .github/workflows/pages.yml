name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install (React/Next)
        run: npm ci

      - name: Build React (root site, unchanged)
        env:
          BASE_PATH: /prigetto
        run: npm run build

      - name: Install Astro
        working-directory: astro
        run: npm ci || npm install

      - name: Build Astro (subpath /v2)
        working-directory: astro
        env:
          BASE_PATH: /prigetto/v2
        run: npm run build

      - name: Assemble combined site (React root + Astro /v2)
        run: |
          mkdir -p _site
          cp -r out/. _site/
          mkdir -p _site/v2
          cp -r astro/dist/. _site/v2/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
